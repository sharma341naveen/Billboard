name: CI\non: [push, pull_request]\njobs: \n  build: \n    runs-on: ubuntu-latest\n    services: \n      postgres: \n        image: postgres:15\n        env: \n          POSTGRES_USER: postgres\n          POSTGRES_PASSWORD: postgres\n          POSTGRES_DB: billboard\n        ports: \n          - 5432:5432\n        options: >-\n          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5\n    steps: \n      - uses: actions/checkout@v4\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: 20\n      - name: Install / Build API\n        working-directory: ./Billboard/api\n        run: |\n          npm ci\n          npm run prisma:generate || true\n          npm run build || true\n      - name: Run API tests\n        working-directory: ./Billboard/api\n        run: npm test || echo "No tests"\n      - name: Install / Build Web\n        working-directory: ./Billboard/web\n        run: |\n          npm ci\n          npm run build || true\n      - name: Run Web tests\n        working-directory: ./Billboard/web\n        run: npm test || echo "No tests"