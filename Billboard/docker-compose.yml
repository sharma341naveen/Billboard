version: "3.8"\nservices: \n  db: \n    image: postgres:15\n    environment: \n      POSTGRES_USER: postgres\n      POSTGRES_PASSWORD: postgres\n      POSTGRES_DB: billboard\n    volumes: \n      - db-data:/var/lib/postgresql/data\n    ports: \n      - "5432:5432"\n\n  api: \n    build: ./Billboard/api\n    env_file: \n      - .env\n    depends_on: \n      - db\n    ports: \n      - "4000:4000"\n    volumes: \n      - ./Billboard/api:/usr/src/app\n    command: npm run dev\n\n  web: \n    build: ./Billboard/web\n    env_file: \n      - .env\n    depends_on: \n      - api\n    ports: \n      - "3000:3000"\n    volumes: \n      - ./Billboard/web:/usr/src/app\n    command: npm run dev\n\nvvolumes: \n  db-data: